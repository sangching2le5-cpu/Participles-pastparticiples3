<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Participles & Past Participles Mastery | B1–B2</title>
<style>
:root{
  --bg:#f5f9ff; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
  --primary:#3b82f6; --primary-dark:#1e40af; --primary-soft:#dbeafe; --primary-light:#eff6ff;
  --border:#e2ecf9; --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --warn:#b45309; --warn-bg:#fef3c7; --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(59,130,246,.07);
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --muted:#94a3b8;
  --border:#1f2a44; --primary-soft:#1e3a8a; --primary-light:#172554;
  --ok-bg:#052e16; --bad-bg:#450a0a; --warn-bg:#451a03;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6; font-size:16px;
  transition:background .2s,color .2s;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3,h4{line-height:1.3;font-weight:700}
ul,ol{padding-left:1.25rem}
li{margin-bottom:.3rem}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:264px;flex:0 0 264px;background:var(--card);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px;
  display:flex;flex-direction:column;gap:6px;z-index:60;transition:transform .25s;
}
.brand{display:flex;gap:10px;align-items:center;padding:8px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand-logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(135deg,#3b82f6,#60a5fa);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;
}
.brand-text b{display:block;font-size:14px;line-height:1.25}
.brand-text span{font-size:11.5px;color:var(--muted)}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 12px;border-radius:11px;color:var(--ink);font-size:14.5px;font-weight:500;
  transition:background .15s,color .15s;
}
.nav-btn:hover{background:var(--primary-light);color:var(--primary-dark)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.nav-btn .ic{font-size:16px;width:20px;text-align:center}
.sidebar-foot{margin-top:auto;padding:12px 10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:12px;
}
[data-theme="dark"] .topbar{background:rgba(17,26,46,.92)}
.hamburger{display:none;font-size:20px;padding:6px 10px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark)}
.topbar-title{font-size:15px;font-weight:700}
.topbar-title small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.pill{background:var(--primary-soft);color:var(--primary-dark);padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px}
.content{padding:22px 18px 70px;max-width:1100px;width:100%;margin:0 auto;flex:1}
.overlay{display:none}

/* Generic */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.page-head{margin-bottom:18px}
.page-head h1{font-size:22px;letter-spacing:-.3px}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
b,strong{font-weight:700}
code{background:var(--primary-light);color:var(--primary-dark);padding:1px 6px;border-radius:6px;font-family:"SFMono-Regular",Consolas,monospace;font-size:.92em}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:11px;font-weight:600;font-size:14.5px;
  background:var(--primary);color:#fff;transition:.15s;border:1px solid transparent;
}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);color:var(--primary-dark);border-color:var(--primary-soft)}
.btn.ghost:hover{background:var(--primary-light)}
.btn.soft{background:var(--primary-soft);color:var(--primary-dark)}
.btn.soft:hover{background:var(--primary-light)}
.btn.danger{background:var(--card);color:var(--bad);border-color:#f5c2c2}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(.95)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn.block{width:100%}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;
}
.chip:hover{border-color:var(--primary-soft)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* Progress bar */
.bar{height:9px;border-radius:999px;background:var(--primary-light);overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:999px;transition:width .4s}
.bar.ok>span{background:linear-gradient(90deg,#16a34a,#4ade80)}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat .value{font-size:24px;font-weight:800;margin-top:2px;color:var(--primary-dark)}
[data-theme="dark"] .stat .value{color:#93c5fd}

/* Lesson styling */
.lesson-header{background:linear-gradient(135deg,var(--primary-light),var(--card));border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.lesson-header .lnum{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--primary);text-transform:uppercase}
.lesson-header h2{font-size:22px;margin-top:2px}
.lesson-header .vi{color:var(--muted);font-size:14px;margin-top:2px}
.objectives{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.obj{background:var(--card);border:1px solid var(--primary-soft);color:var(--primary-dark);font-size:12.5px;padding:5px 11px;border-radius:999px}
.sec-title{font-size:17px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--primary)}
.ls-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.ls-section h3{font-size:15.5px;color:var(--primary-dark);margin-bottom:8px}
[data-theme="dark"] .ls-section h3{color:#93c5fd}
.ls-section p{margin-bottom:8px;font-size:14.6px}
.ls-section ul{margin:6px 0 10px 4px;font-size:14.5px}
.note{background:var(--warn-bg);border-left:3px solid #f59e0b;padding:9px 12px;border-radius:0 10px 10px 0;font-size:14px;color:#7c4a03;margin:8px 0}
[data-theme="dark"] .note{color:#fbbf24}
.ex{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--primary-light);margin-bottom:10px}
[data-theme="dark"] .ex{background:var(--primary-light)}
.ex .en{font-size:15px;font-weight:600;margin-top:3px}
.ex .vi{font-size:13.5px;color:var(--muted);font-style:italic}
.mistake{border:1px solid #fde3e3;background:var(--bad-bg);border-radius:12px;padding:12px 14px;margin-bottom:10px}
[data-theme="dark"] .mistake{border-color:#7f1d1d}
.mistake .wrong{color:var(--bad);font-size:14.5px}
.mistake .right{color:var(--ok);font-size:14.5px;font-weight:600}
.mistake .why{font-size:13.5px;color:var(--muted);margin-top:5px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.tbl th,table.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
table.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}

/* Questions */
.q-wrap{max-width:820px;margin:0 auto}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.q-counter{font-size:13px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:4px 12px;border-radius:999px}
.timer{font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:4px 12px;border-radius:999px}
.timer.danger{color:var(--bad);background:var(--bad-bg)}
.q-text{font-size:16.5px;font-weight:600;margin-bottom:6px;white-space:pre-line}
.q-context{background:var(--primary-light);border-left:3px solid var(--primary);padding:11px 14px;border-radius:0 10px 10px 0;font-size:14.5px;color:var(--ink);margin-bottom:12px;white-space:pre-line}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:13px 15px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);
  margin-bottom:9px;font-size:15px;transition:.12s;
}
.opt:hover{border-color:#93c5fd;background:var(--primary-light)}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:7px;background:var(--primary-soft);color:var(--primary-dark);
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.opt.sel{border-color:var(--primary);background:var(--primary-light)}
.opt.sel .k{background:var(--primary);color:#fff}
.opt.correct{border-color:#4ade80;background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:#f87171;background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}

input[type=text].answer,textarea.answer{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:15px;background:var(--card);outline:none;transition:.15s;
}
textarea.answer{min-height:80px;resize:vertical}
input[type=text].answer:focus,textarea.answer:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12)}

select.match{
  padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);
  font-size:14px;max-width:100%;outline:none;flex:1 1 230px;min-width:0;
}
.match-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.match-row:last-child{border-bottom:none}
.match-left{font-size:14.5px;font-weight:600;flex:1 1 220px;min-width:0}
.match-row.correct select{border-color:#4ade80;background:var(--ok-bg)}
.match-row.wrong select{border-color:#f87171;background:var(--bad-bg)}

.feedback{border-radius:13px;padding:14px 16px;margin-top:14px;font-size:14.6px}
.feedback.ok{background:var(--ok-bg);border:1px solid #86efac;color:#14532d}
.feedback.bad{background:var(--bad-bg);border:1px solid #fca5a5;color:#7f1d1d}
.feedback.neutral{background:var(--warn-bg);border:1px solid #fcd34d;color:#78350f}
[data-theme="dark"] .feedback.ok{color:#bbf7d0}
[data-theme="dark"] .feedback.bad{color:#fecaca}
[data-theme="dark"] .feedback.neutral{color:#fde68a}
.feedback .fb-title{font-weight:800;margin-bottom:4px;font-size:15px}
.feedback .fb-ans{background:rgba(255,255,255,.55);border-radius:9px;padding:9px 12px;margin-top:8px;font-size:14px}
[data-theme="dark"] .feedback .fb-ans{background:rgba(0,0,0,.2)}
.feedback .fb-exp{margin-top:9px;font-size:14px;line-height:1.6}

.result-hero{text-align:center;padding:26px 18px}
.score-ring{
  width:132px;height:132px;border-radius:50%;margin:0 auto 14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:30px;color:var(--primary-dark);
  background:conic-gradient(var(--primary) var(--pct), var(--primary-light) 0);position:relative;
}
[data-theme="dark"] .score-ring{color:#93c5fd}
.score-ring::after{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}
.score-ring span{position:relative;z-index:1;line-height:1}
.score-ring small{position:relative;z-index:1;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin-top:3px}

.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:#166534}
.badge.bad{background:var(--bad-bg);color:#991b1b}
.badge.warn{background:var(--warn-bg);color:#92400e}
.badge.info{background:var(--primary-soft);color:var(--primary-dark)}
[data-theme="dark"] .badge.ok{color:#bbf7d0}
[data-theme="dark"] .badge.bad{color:#fecaca}
[data-theme="dark"] .badge.warn{color:#fde68a}
[data-theme="dark"] .badge.info{color:#bfdbfe}

.empty{text-align:center;padding:44px 18px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px}

.lesson-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.lesson-card:hover{border-color:var(--primary-soft);transform:translateY(-2px)}
.lesson-card h4{font-size:14.5px;margin-bottom:2px}
.lesson-card .sub{font-size:12px;color:var(--muted);margin-bottom:9px}

.switch{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.switch:last-child{border-bottom:none}
.switch input{width:18px;height:18px;accent-color:var(--primary)}
input[type=number].num{padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;width:100px;background:var(--card)}
.search-box{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;
  background:var(--card);font-size:14.5px;outline:none;
}
.search-box:focus{border-color:var(--primary)}

/* Responsive */
@media (max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);
    box-shadow:0 0 40px rgba(15,23,42,.18);
  }
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:block}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50}
  .content{padding:16px 12px 80px}
  .topbar-right .hide-sm{display:none}
  body{font-size:15.5px}
}
@media (max-width:480px){
  .card{padding:15px}
  .lesson-header{padding:15px}
  .lesson-header h2{font-size:19px}
  .btn{padding:9px 15px;font-size:14px}
  .opt{padding:11px 12px;font-size:14.5px}
  .score-ring{width:112px;height:112px;font-size:25px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">PM</div>
      <div class="brand-text">
        <b>Participles Mastery</b>
        <span>B1–B2 · Vietnamese Support</span>
      </div>
    </div>
    <button class="nav-btn" data-action="nav" data-view="dashboard"><span class="ic">📊</span> Dashboard</button>
    <button class="nav-btn" data-action="nav" data-view="lessons"><span class="ic">📘</span> Grammar Lessons</button>
    <button class="nav-btn" data-action="nav" data-view="practice"><span class="ic">✏️</span> Practice Center</button>
    <button class="nav-btn" data-action="nav" data-view="tests"><span class="ic">📝</span> Comprehensive Tests</button>
    <button class="nav-btn" data-action="nav" data-view="progress"><span class="ic">📈</span> Progress</button>
    <button class="nav-btn" data-action="nav" data-view="mistakes"><span class="ic">🔁</span> Mistakes Review</button>
    <button class="nav-btn" data-action="nav" data-view="settings"><span class="ic">⚙️</span> Settings</button>
    <div class="sidebar-foot">
      Participles &amp; Past Participles Mastery<br>
      Nội dung học tập được biên soạn riêng cho người học Việt Nam B1–B2.
    </div>
  </aside>
  <div class="overlay" id="overlay" data-action="close-sidebar"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" data-action="toggle-sidebar" aria-label="Mở menu">☰</button>
      <div class="topbar-title" id="topTitle">
        Dashboard
        <small>Participles &amp; Past Participles Mastery</small>
      </div>
      <div class="topbar-right">
        <span class="pill hide-sm" id="topStreak">🔥 0 ngày</span>
        <span class="pill" id="topAcc">0% chính xác</span>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<script>
"use strict";

/* =======================================================================
   1. LESSONS DATA
   ======================================================================= */
const LESSONS = [
{
id:1, title:"Introduction to Participles", titleVI:"Giới thiệu về Phân từ", level:"B1",
objectives:[
  "Hiểu phân từ là gì và hai dạng cơ bản: V-ing (present participle) và V3/-ed (past participle)",
  "Phân biệt hình thức động từ và phân từ dùng như tính từ",
  "Nhận biết phân từ trong các thì tiếp diễn, hoàn thành và bị động"
],
sections:[
 {heading:"1. What is a participle? — Phân từ là gì?", html:
  "<p><b>Phân từ (participle)</b> là một dạng của động từ, được dùng để tạo các thì phức hợp (tiếp diễn, hoàn thành, bị động) hoặc hoạt động như một <b>tính từ</b> bổ nghĩa cho danh từ.</p>"+
  "<p>Có hai loại phân từ chính trong tiếng Anh:</p>"+
  "<ul><li><b>Present participle (Phân từ hiện tại): V-ing</b> — ví dụ: <i>running, writing, doing</i></li>"+
  "<li><b>Past participle (Phân từ quá khứ): V3 / -ed</b> — ví dụ: <i>broken, written, done</i></li></ul>"+
  "<div class='note'>Lưu ý quan trọng: tên gọi “present” và “past” chỉ hình thức ngữ pháp, <b>không quyết định thì</b> của câu. Ví dụ <i>broken</i> có thể xuất hiện trong câu hiện tại: <i>The window is broken.</i></div>"},
 {heading:"2. Participle as part of a verb phrase", html:
  "<p>Phân từ thường kết hợp với trợ động từ để tạo thành các thì:</p>"+
  "<ul><li><b>Tiếp diễn:</b> She <b>is studying</b> English. (be + V-ing)</li>"+
  "<li><b>Hoàn thành:</b> I <b>have finished</b> my homework. (have + V3)</li>"+
  "<li><b>Bị động:</b> The book <b>was written</b> by a famous author. (be + V3)</li></ul>"},
 {heading:"3. Participle as an adjective", html:
  "<p>Phân từ có thể đứng trước danh từ hoặc sau động từ nối (linking verb) để bổ nghĩa:</p>"+
  "<ul><li><b>Trước danh từ:</b> a <i>boring</i> lecture, a <i>broken</i> window, an <i>exciting</i> match</li>"+
  "<li><b>Sau linking verb:</b> The lesson <i>is interesting</i>. / She <i>looks tired</i>.</li></ul>"+
  "<div class='note'>Cùng một phân từ, tùy ngữ cảnh, có thể là một phần của động từ ghép hoặc là một tính từ. Ví dụ: <i>The door was closed.</i> (bị động – hành động) so với <i>The door is closed.</i> (tính từ – trạng thái).</div>"}
],
examples:[

{
id:2, title:"Present Participle (V-ing)", titleVI:"Phân từ hiện tại (V-ing)", level:"B1",
objectives:[
  "Nắm quy tắc thành lập V-ing và các trường hợp chính tả đặc biệt",

  "Dùng V-ing như tính từ mang nghĩa chủ động",

],
sections:[
 {heading:"1. Formation & spelling rules", html:
  "<table class='tbl'><thead><tr><th>Quy tắc</th><th>Ví dụ</th></tr></thead><tbody>"+
  "<tr><td>Thêm <b>-ing</b> vào động từ thường</td><td>work → working, read → reading</td></tr>"+
  "<tr><td>Động từ tận cùng <b>-e</b> → bỏ <b>e</b>, thêm <b>-ing</b></td><td>make → making, write → writing</td></tr>"+
  "<tr><td>Động từ một âm tiết tận cùng bằng <b>1 phụ âm</b> sau <b>1 nguyên âm</b> → gấp đôi phụ âm</td><td>run → running, sit → sitting, stop → stopping</td></tr>"+
  "<tr><td>Động từ tận cùng <b>-ie</b> → đổi thành <b>-ying</b></td><td>lie → lying, die → dying</td></tr>"+
  "<tr><td>Động từ tận cùng <b>-ee, -oe, -ye</b> → giữ nguyên</td><td>see → seeing, agree → agreeing</td></tr>"+
  "</tbody></table>"},
 {heading:"2. V-ing in continuous tenses", html:
  "<p>V-ing xuất hiện trong tất cả các thì tiếp diễn: hiện tại tiếp diễn, quá khứ tiếp diễn, hiện tại hoàn thành tiếp diễn, tương lai tiếp diễn.</p>"+
  "<ul><li>She <b>is working</b> in the office right now.</li>"+
  "<li>They <b>were playing</b> football when it started to rain.</li>"+
  "<li>I <b>have been studying</b> English for five years.</li></ul>"},
 {heading:"3. V-ing as an adjective (active meaning)", html:
  "<p>Khi làm tính từ, V-ing thường mang <b>nghĩa chủ động</b> — mô tả đối tượng <i>gây ra</i> cảm giác hoặc <i>đang thực hiện</i> hành động:</p>"+
  "<ul><li>The film is <b>boring</b>. (bộ phim gây buồn chán)</li>"+
  "<li>We watched the <b>rising</b> sun.</li></ul>"},
 {heading:"4. Present participle clause", html:
  "<p>Mệnh đề V-ing có thể rút gọn một mệnh đề phụ mang nghĩa chủ động:</p>"+
  "<ul><li><b>Knowing</b> the answer, she raised her hand. (= Because she knew the answer, ...)</li>"+
  "<li><b>Walking</b> home, I met an old friend. (= While I was walking home, ...)</li></ul>"+
  "<div class='note'>Chủ ngữ ẩn của mệnh đề V-ing phải trùng với chủ ngữ mệnh đề chính — nếu không sẽ tạo ra lỗi <b>dangling participle</b> (xem Lesson 9).</div>"}
],
examples:[
 {en:"She is working in the office.", vi:"Cô ấy đang làm việc trong văn phòng. (thì tiếp diễn)"},
 {en:"The man standing near the door is my teacher.", vi:"Người đàn ông đứng gần cửa là giáo viên của tôi. (V-ing sau danh từ, chủ động)"},

 {en:"Not knowing what to do, I called my friend.", vi:"Không biết phải làm gì, tôi đã gọi cho bạn tôi. (mệnh đề phủ định)"},
 {en:"Walking home, I saw a beautiful sunset.", vi:"Trong khi đi bộ về nhà, tôi thấy một hoàng hôn đẹp."},
 {en:"The students are preparing for the exam.", vi:"Các sinh viên đang chuẩn bị cho kỳ thi."}
],
mistakes:[

 {wrong:"The book is very interested.", right:"The book is very interesting.", why:"Sách gây hứng thú → dùng V-ing (interesting), không dùng V3."},

  "<tr><td rowspan='4'>Regular (-ed)</td><td>work</td><td>worked</td></tr>"+
  "<tr><td>study</td><td>studied</td></tr>"+
  "<tr><td>stop</td><td>stopped</td></tr>"+
  "<tr><td>arrive</td><td>arrived</td></tr>"+
  "<tr><td rowspan='5'>Irregular</td><td>write</td><td>written</td></tr>"+
  "<tr><td>break</td><td>broken</td></tr>"+

  "<tr><td>do</td><td>done</td></tr>"+
  "<tr><td>see</td><td>seen</td></tr>"+
  "</tbody></table>"},
 {heading:"2. V3 in perfect tenses", html:
  "<p>V3 là thành phần bắt buộc sau trợ động từ <b>have / has / had</b> trong các thì hoàn thành:</p>"+
  "<ul><li>I <b>have finished</b> my homework.</li>"+
  "<li>She <b>had left</b> before we arrived.</li>"+
  "<li>They <b>will have completed</b> the project by June.</li></ul>"},
 {heading:"3. V3 in passive voice", html:
  "<p>Cấu trúc bị động: <code>be + V3</code> ở mọi thì.</p>"+
  "<ul><li>The window <b>was broken</b> yesterday.</li>"+
  "<li>The report <b>has been submitted</b>.</li>"+
  "<li>The bridge <b>is being repaired</b>.</li></ul>"},
 {heading:"4. V3 as an adjective (passive/state meaning)", html:
  "<p>Khi làm tính từ, V3 mang <b>nghĩa bị động</b> hoặc mô tả <b>trạng thái</b> — đối tượng <i>chịu tác động</i> hoặc đang ở trạng thái nào đó:</p>"+
  "<ul><li>a <b>broken</b> window (cửa sổ bị làm vỡ)</li>"+
  "<li>a <b>written</b> exam (bài thi được viết)</li>"+
  "<li>a <b>frightened</b> child (đứa trẻ cảm thấy sợ)</li>"+
  "<li>The documents <b>submitted</b> yesterday are on the desk. (được nộp hôm qua)</li></ul>"}
],

id:4, title:"Present vs Past Participle as Adjectives", titleVI:"Phân từ hiện tại vs quá khứ (làm tính từ)", level:"B1",

sections:[
 {heading:"1. Nguyên tắc cốt lõi", html:
  "<p><b>V-ing</b> mô tả <i>đối tượng gây ra</i> cảm giác, hiệu ứng, hoặc có tính chất chủ động.</p>"+
  "<p><b>V3/-ed</b> mô tả <i>người hoặc vật cảm thấy</i> cảm giác đó, hoặc bị tác động bởi ai/cái gì.</p>"+
  "<div class='note'>Quy tắc thực hành: Nếu chủ ngữ là <b>người</b> và động từ diễn tả cảm xúc → thường dùng <b>V3/-ed</b>. Nếu chủ ngữ là <b>vật / sự việc</b> gây ra cảm xúc → thường dùng <b>V-ing</b>. Tuy nhiên nghĩa còn phụ thuộc vào ngữ cảnh.</div>"},
 {heading:"2. Bảng so sánh các cặp tính từ thông dụng", html:

 {heading:"3. Phân tích chi tiết một số cặp", html:
  "<p><b>Interesting / Interested</b></p>"+
  "<ul><li>The lecture is <i>interesting</i>. — Bài giảng thú vị (bài giảng gây hứng thú).</li>"+

  "<p><b>Confusing / Confused</b></p>"+
  "<ul><li>The instructions are <i>confusing</i>. — Hướng dẫn khó hiểu (gây bối rối).</li>"+
  "<li>I am <i>confused</i> by the instructions. — Tôi bị bối rối bởi hướng dẫn.</li></ul>"+
  "<div class='note'>Ngoại lệ: một số tính từ V-ing có thể dùng cho người khi nhấn mạnh tính chất, ví dụ: <i>He is very interesting.</i> (anh ấy thú vị) hoặc <i>She is amazing.</i> (cô ấy tuyệt vời).</div>"}

{
id:5, title:"Participles as Adjectives", titleVI:"Phân từ làm tính từ", level:"B1",
objectives:[
  "Dùng phân từ trước danh từ và sau động từ nối",
  "Phân biệt ý nghĩa chủ động (V-ing) và bị động/trạng thái (V3)",
  "Nhận biết tính từ phân từ trong miêu tả thực tế"
],
sections:[
 {heading:"1. Participle before a noun — Phân từ trước danh từ", html:
  "<p>Phân từ có thể đứng ngay trước danh từ để bổ nghĩa:</p>"+
  "<ul><li>an <b>exciting</b> experience (trải nghiệm thú vị — gây hứng thú)</li>"+
  "<li>a <b>broken</b> window (cửa sổ bị vỡ)</li>"+
  "<li>a <b>running</b> tap (vòi nước đang chảy)</li>"+
  "<li>a <b>written</b> exam (bài thi viết)</li></ul>"},
 {heading:"2. Participle after a linking verb", html:
  "<p>Sau các động từ nối (<i>be, look, seem, feel, become, get, sound, taste, smell</i>) ta dùng phân từ như tính từ:</p>"+
  "<ul><li>She <b>looks tired</b>. (cô ấy trông có vẻ mệt)</li>"+
  "<li>The situation <b>seems confusing</b>.</li>"+
  "<li>I <b>feel exhausted</b> after work.</li></ul>"},
 {heading:"3. Adjective meaning vs verb meaning", html:
  "<p>Cần phân biệt khi nào phân từ là một phần của động từ ghép, khi nào nó là tính từ:</p>"+
  "<ul><li>She <b>is writing</b> a letter. → động từ ghép (thì tiếp diễn)</li>"+
  "<li>This is a <b>writing</b> desk. → tính từ (bàn để viết)</li>"+
  "<li>The door <b>was closed</b> by the guard. → bị động (hành động)</li>"+
  "<li>The door <b>is closed</b>. → tính từ (trạng thái)</li></ul>"+
  "<div class='note'>Khi muốn diễn tả <i>trạng thái</i> (kết quả còn lại), ta thường dùng tính từ phân từ ở thì hiện tại: <i>The window is broken.</i> Khi muốn diễn tả <i>hành động</i>, ta thêm tác nhân hoặc trạng ngữ thời gian: <i>The window was broken by the storm yesterday.</i></div>"},
 {heading:"4. Common adjective patterns", html:
  "<ul><li><b>be + participle + preposition:</b> interested <i>in</i>, bored <i>with</i>, tired <i>of</i>, surprised <i>at</i></li>"+
  "<li><b>a + participle + noun:</b> a disappointing result, an exciting trip, a broken promise</li>"+
  "<li><b>participle + -ly → adverb?</b> — Không phải lúc nào cũng có. Ví dụ: <i>surprisingly</i> (trạng từ) ≠ <i>surprised</i> (tính từ).</li></ul>"}
],
examples:[

 {en:"His encouraging words helped me a lot.", vi:"Lời động viên của anh ấy giúp tôi rất nhiều."},
 {en:"I felt relieved when the exam finished.", vi:"Tôi cảm thấy nhẹ nhõm khi kỳ thi kết thúc."}
],
mistakes:[
 {wrong:"The game was very excited.", right:"The game was very exciting.", why:"Trận đấu gây hào hứng → V-ing (exciting)."},

 {wrong:"This knife is broken — it doesn't cut.", right:"This knife is broken — it doesn't cut.", why:"Không sai ngữ pháp — nhưng lưu ý 'broken' ở đây là tính từ, không phải động từ ghép."}
]
},
{
id:6, title:"Participles after Nouns — Reduced Relative Clauses", titleVI:"Phân từ sau danh từ — Mệnh đề quan hệ rút gọn", level:"B2",
objectives:[
  "Rút gọn mệnh đề quan hệ chủ động bằng V-ing",
  "Rút gọn mệnh đề quan hệ bị động bằng V3",
  "Nhận biết khi nào có thể rút gọn và khi nào không"
],
sections:[
 {heading:"1. Active reduction: noun + V-ing", html:
  "<p>Khi mệnh đề quan hệ ở dạng chủ động với <b>who/which + is/are/was/were + V-ing</b> hoặc <b>who/which + V(s/es)</b>, ta có thể rút gọn thành cụm <b>noun + V-ing</b>:</p>"+
  "<ul><li>The woman <b>who is talking</b> to the manager is my teacher. → The woman <b>talking</b> to the manager is my teacher.</li>"+
  "<li>The students <b>who study</b> hard will succeed. → The students <b>studying</b> hard will succeed.</li></ul>"+
  "<div class='note'>Chỉ rút gọn được khi chủ từ của mệnh đề quan hệ <b>trùng với chủ từ/danh từ đứng trước</b>.</div>"},
 {heading:"2. Passive reduction: noun + V3", html:
  "<p>Khi mệnh đề quan hệ ở dạng bị động với <b>which/that + is/are/was/were + V3</b>, ta rút gọn thành <b>noun + V3</b>:</p>"+
  "<ul><li>The documents <b>which were submitted</b> yesterday are important. → The documents <b>submitted</b> yesterday are important.</li>"+
  "<li>The house <b>which was built</b> in 1890 is now a museum. → The house <b>built</b> in 1890 is now a museum.</li></ul>"},
 {heading:"3. Khi nào KHÔNG rút gọn?", html:
  "<ul><li>Mệnh đề quan hệ ở thì <b>tương lai</b> hoặc <b>hiện tại hoàn thành</b> thường không rút gọn được: <i>The man who will teach us is...</i> (không rút gọn thành <s>the man teaching us</s> nếu ý là tương lai).</li>"+
  "<li>Mệnh đề quan hệ <b>không xác định</b> với dấu phẩy: <i>My brother, who lives in Tokyo, ...</i> → ít khi rút gọn (trừ văn viết trang trọng).</li>"+
  "<li>Khi mệnh đề quan hệ ở dạng phủ định: <i>The man who didn't come</i> → không rút gọn tự nhiên.</li></ul>"},
 {heading:"4. Lưu ý về chủ động vs bị động", html:

const LS_KEY = "participles_mastery_v1";
function defaultStore(){
  return {
    lessonsCompleted:{},
    stats:{attempted:0, correct:0},
    categories:{},
    mistakes:{},
    tests:{},
    activity:[],
    settings:{darkMode:false, showExplanations:true},
    streak:{lastDate:null, count:0}
  };
}
let STORE = defaultStore();
function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const p = JSON.parse(raw);
      STORE = Object.assign(defaultStore(), p);
      STORE.stats = Object.assign({attempted:0,correct:0}, p.stats || {});
      STORE.categories = p.categories || {};
      STORE.mistakes = p.mistakes || {};
      STORE.tests = p.tests || {};
      STORE.activity = p.activity || [];
      STORE.lessonsCompleted = p.lessonsCompleted || {};
      STORE.settings = Object.assign({darkMode:false, showExplanations:true}, p.settings || {});
      STORE.streak = Object.assign({lastDate:null,count:0}, p.streak || {});
    }
  }catch(e){ STORE = defaultStore(); }
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STORE)); }catch(e){}
}

const esc = s => String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
function norm(s){
  return String(s==null?"":s)
    .toLowerCase()
    .replace(/[’‘`´]/g,"'")
    .replace(/[^\p{L}\p{N}\s']/gu," ")
    .replace(/\s+/g," ")
    .trim();
}
function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function pct(n,d){ return d ? Math.round((n/d)*100) : 0; }
function fmtDate(ts){
  if(!ts) return "—";
  const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function todayStr(){
  const d = new Date(); const p = n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* =======================================================================
   7. STREAK
   ======================================================================= */
function touchStreak(){
  const today = todayStr();
  if(STORE.streak.lastDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const p = n=>String(n).padStart(2,"0");
  const yesterday = y.getFullYear()+"-"+p(y.getMonth()+1)+"-"+p(y.getDate());
  if(STORE.streak.lastDate === yesterday) STORE.streak.count++;
  else STORE.streak.count = 1;
  STORE.streak.lastDate = today;
  saveStore();
}

/* =======================================================================
   8. RECORDING
   ======================================================================= */
function recordAnswer(q, correct, userAnswer){
  STORE.stats.attempted++;
  if(correct) STORE.stats.correct++;
  if(q.category){
    if(!STORE.categories[q.category]) STORE.categories[q.category] = {attempted:0,correct:0};
    STORE.categories[q.category].attempted++;
    if(correct) STORE.categories[q.category].correct++;
  }
  if(correct){
    delete STORE.mistakes[q.id];
  }else{
    STORE.mistakes[q.id] = {userAnswer: userAnswer||"", date: Date.now()};
  }
  touchStreak();
  saveStore();
}
function recordActivity(mode, label, score, total){
  STORE.activity.unshift({ts:Date.now(), mode, label, score, total});
  if(STORE.activity.length > 50) STORE.activity.length = 50;
  saveStore();
}

/* =======================================================================
   12. LESSONS
   ======================================================================= */
function viewLessons(){
  const search = state.searchTerm.toLowerCase();
  const filtered = LESSONS.filter(l=>
    !search ||
    l.title.toLowerCase().includes(search) ||
    l.titleVI.toLowerCase().includes(search)
  );

  if(state.lessonId && !filtered.find(l=>l.id===state.lessonId)){
    state.lessonId = filtered[0] ? filtered[0].id : 1;
  }
  const current = LESSONS.find(l=>l.id===state.lessonId) || LESSONS[0];

  const cards = filtered.map(l=>`
    <div class='lesson-card' data-action='select-lesson' data-id='${l.id}'>
      <h4>Bài ${l.id}: ${esc(l.title)}</h4>
      <div class='sub'>${esc(l.titleVI)} · ${l.level}</div>
      <div class='row tiny'>
        ${STORE.lessonsCompleted[l.id] ? "<span class='badge ok'>Đã hoàn thành</span>" : "<span class='badge warn'>Chưa hoàn thành</span>"}
        <span class='spacer'></span>
        <span class='badge info'>${l.sections.length} phần</span>
      </div>
    </div>
  `).join("");

  const sections = current.sections.map(s=>`
    <div class='ls-section'>
      <h3>${esc(s.heading)}</h3>
      ${s.html}
    </div>
  `).join("");

  const examples = current.examples.map(e=>`
    <div class='ex'>
      <div class='en'>“${esc(e.en)}”</div>
      <div class='vi'>${esc(e.vi)}</div>
    </div>
  `).join("");

  const mistakes = current.mistakes.map(m=>`
    <div class='mistake'>
      <div class='wrong'>✗ ${esc(m.wrong)}</div>
      <div class='right'>✓ ${esc(m.right)}</div>
      <div class='why'>${esc(m.why)}</div>
    </div>
  `).join("");

  const mini = QUESTIONS.filter(q=>q.lesson === current.id && q.type === "mcq").slice(0,5);
  const miniHtml = mini.length
    ? mini.map((q,i)=>renderQuestionCard(q,i+1,`mini-${current.id}`)).join("")
    : "<div class='muted small'>Không có câu hỏi trắc nghiệm nào cho bài này.</div>";

  return `
  <div class='page-head'><h1>Grammar Lessons</h1><p>10 bài học chi tiết về phân từ. Chọn bài để xem lý thuyết, ví dụ, lỗi thường gặp và bài tập mini.</p></div>

  <div class='card'>
    <input class='search-box' type='text' placeholder='🔍 Tìm bài học...' id='lessonSearch' value='${esc(state.searchTerm)}'>
  </div>

  <div class='grid g3' style='margin-top:14px'>${cards}</div>

  <div class='lesson-header' style='margin-top:20px'>
    <div class='lnum'>Bài ${current.id} · ${current.level}</div>
    <h2>${esc(current.title)}</h2>
    <div class='vi'>${esc(current.titleVI)}</div>
    <div class='objectives'>
      ${current.objectives.map(o=>`<span class='obj'>${esc(o)}</span>`).join("")}
    </div>
    <div class='row' style='margin-top:14px'>
      ${STORE.lessonsCompleted[current.id]
        ? "<span class='badge ok'>✓ Đã hoàn thành bài học</span>"
        : "<span class='badge warn'>Chưa hoàn thành — hãy học lý thuyết rồi đánh dấu</span>"}
      <span class='spacer'></span>
      <button class='btn sm' data-action='mark-lesson-done' data-id='${current.id}'>${STORE.lessonsCompleted[current.id]?'↺ Bỏ đánh dấu':'✓ Đánh dấu đã hoàn thành'}</button>
    </div>
  </div>

  <div class='sec-title'>Nội dung chi tiết</div>
  ${sections}

  <div class='sec-title'>Ví dụ minh hoạ</div>
  <div class='card'>${examples}</div>

  <div class='sec-title'>Lỗi thường gặp</div>
  <div class='card'>${mistakes}</div>

  <div class='sec-title'>Mini practice</div>
  <div class='card'>
    <div class='small muted' style='margin-bottom:12px'>Chọn đáp án đúng. Sau khi chọn, bấm “Kiểm tra” để xem giải thích.</div>
    <div id='miniContainer'>${miniHtml}</div>
  </div>

  <div class='row' style='margin-top:16px;justify-content:space-between'>
    <button class='btn ghost' data-action='prev-lesson' ${current.id<=1?'disabled':''}>← Bài trước</button>
    <button class='btn' data-action='next-lesson' ${current.id>=10?'disabled':''}>Bài tiếp theo →</button>
  </div>
  `;
}
function renderQuestionCard(q, num, groupId){
  const opts = q.options.map((o,i)=>{
    const k = String.fromCharCode(65+i);
    return `<button class='opt' data-action='mini-opt' data-group='${groupId}' data-qid='${q.id}' data-value='${esc(o)}'>
      <span class='k'>${k}</span><span>${esc(o)}</span>
    </button>`;
  }).join("");
  return `
    <div class='q-wrap' style='margin-bottom:14px' data-mini="${q.id}">
      <div class='q-counter' style='display:inline-block;margin-bottom:8px'>Câu ${num}</div>
      <div class='q-text'>${esc(q.question)}</div>
      ${opts}
      <div class='row' style='margin-top:8px'>
        <button class='btn sm' data-action='mini-check' data-qid='${q.id}'>Kiểm tra</button>
      </div>
      <div class='feedback-slot' data-slot="${q.id}"></div>
    </div>
  `;
}

/* =======================================================================
   13. PRACTICE CENTER
   ======================================================================= */
function viewPractice(){
  const categories = ["all","present_participle","past_participle","ving_vs_v3","reduced_relative","participle_clause","perfect_participle","error_correction","translation","mixed"];
  const catChips = categories.map(c=>
    `<button class='chip ${state.practiceCategory===c?'active':''}' data-action='select-cat' data-cat='${c}'>${c==='all'?'Tất cả':esc(CATEGORY_LABEL[c])}</button>`
  ).join("");

  const diffChips = ["all","B1","B2"].map(d=>
    `<button class='chip ${state.practiceDifficulty===d?'active':''}' data-action='select-diff' data-diff='${d}'>${d==='all'?'Mọi độ khó':d}</button>`
  ).join("");

  const types = ["all","mcq","fill","reduced","clause","error","translate"];
  const typeChips = types.map(t=>
    `<button class='chip ${state.practiceType===t?'active':''}' data-action='select-ptype' data-ptype='${t}'>${t==='all'?'Mọi dạng':esc(TYPE_LABEL[t])}</button>`
  ).join("");

  let pool = QUESTIONS.filter(q=>{
    if(state.practiceCategory!=='all' && q.category !== state.practiceCategory) return false;
    if(state.practiceDifficulty!=='all' && q.difficulty !== state.practiceDifficulty) return false;
    if(state.practiceType!=='all' && q.type !== state.practiceType) return false;
    return true;
  });

  const samples = pool.slice(0,5).map(q=>{
    const diff = q.difficulty;
    return `<div class='row' style='padding:8px 0;border-bottom:1px solid var(--border)'>
      <div style='flex:1 1 200px;min-width:0'>
        <div class='small' style='font-weight:600'>${esc(q.question.length>70?q.question.slice(0,70)+'…':q.question)}</div>
        <div class='tiny muted'>${esc(TYPE_LABEL[q.type]||q.type)} · ${esc(CATEGORY_LABEL[q.category]||q.category)} · ${diff}</div>
      </div>
    </div>`;
  }).join("");

  const matchingPool = MATCHING.filter(m=>{
    if(state.practiceCategory!=='all' && m.category !== state.practiceCategory) return false;
    if(state.practiceDifficulty!=='all' && m.difficulty !== state.practiceDifficulty) return false;
    return true;
  });

  return `
  <div class='page-head'><h1>Practice Center</h1><p>Chọn chủ đề, độ khó và dạng bài tập. Hệ thống sẽ tạo lượt luyện tập ngẫu nhiên từ ngân hàng câu hỏi.</p></div>

  <div class='card'>
    <div class='small muted' style='margin-bottom:6px'>Chủ đề:</div>
    <div class='chips'>${catChips}</div>
    <div class='small muted' style='margin:10px 0 6px'>Độ khó:</div>
    <div class='chips'>${diffChips}</div>
    <div class='small muted' style='margin:10px 0 6px'>Dạng bài:</div>
    <div class='chips'>${typeChips}</div>
    <div class='row' style='margin-top:12px'>
      <span class='badge info'>${pool.length} câu hỏi phù hợp</span>
      <span class='spacer'></span>
      <button class='btn' data-action='start-practice'>▶ Bắt đầu luyện tập</button>
    </div>
  </div>

  <div class='card' style='margin-top:16px'>
    <b>Matching Exercises</b>
    <p class='small muted' style='margin-top:4px'>Nối cặp khái niệm — ${matchingPool.length} bộ bài có sẵn.</p>
    <div class='row' style='margin-top:12px'>
      ${matchingPool.map(m=>`<button class='btn sm ghost' data-action='start-matching' data-id='${m.id}'>🔗 ${esc(m.title)}</button>`).join("")}
    </div>
  </div>

  <div class='sec-title'>Xem trước ngân hàng câu hỏi</div>
  <div class='card'>${samples||"<div class='muted small'>Không có câu nào phù hợp với bộ lọc hiện tại.</div>"}</div>
  `;
}

function viewProgress(){
  const lessonsDone = Object.keys(STORE.lessonsCompleted).length;
  const acc = pct(STORE.stats.correct, STORE.stats.attempted);

  const catRows = Object.keys(CATEGORY_LABEL).map(c=>{
    const d = STORE.categories[c] || {attempted:0,correct:0};
    const p = pct(d.correct, d.attempted);
    return `<tr>
      <td>${esc(CATEGORY_LABEL[c])}</td>
      <td>${d.attempted}</td>
      <td>${d.correct}</td>
      <td><b>${p}%</b></td>
      <td style='width:140px'><div class='bar'><span style='width:${p}%'></span></div></td>
    </tr>`;
  }).join("");

  const testRows = TESTS.map(t=>{
    const r = STORE.tests[t.id];
    if(!r) return `<tr><td>${esc(t.title)}</td><td colspan='4' class='muted'>Chưa làm</td></tr>`;
    return `<tr>
      <td>${esc(t.title)}</td>
      <td>${r.attempts}</td>
      <td>${r.best||0}%</td>
      <td>${r.last||0}%</td>
      <td class='tiny muted'>${fmtDate(r.lastDate)}</td>
    </tr>`;
  }).join("");

  const empty = STORE.stats.attempted === 0 && lessonsDone === 0;
  if(empty){
    return `<div class='page-head'><h1>Progress</h1></div>
      <div class='card empty'>
        <div class='big'>📊</div>
        <b>Bạn chưa hoàn thành bài luyện tập nào.</b><br>
        <span class='small'>Hãy bắt đầu với một bài học hoặc luyện tập để theo dõi tiến độ.</span><br><br>
        <button class='btn' data-action='nav' data-view='lessons'>📘 Bắt đầu học</button>
      </div>`;
  }

  return `
  <div class='page-head'><h1>Progress Dashboard</h1><p>Theo dõi tiến độ học tập chi tiết.</p></div>

  <div class='grid g4'>
    ${statCard("Bài học đã xong", lessonsDone+" / 10")}
    ${statCard("Tổng câu đã làm", String(STORE.stats.attempted))}
    ${statCard("Độ chính xác", acc+"%")}
    ${statCard("Câu cần ôn lại", String(Object.keys(STORE.mistakes).length))}
  </div>

  <div class='sec-title'>Hiệu suất theo chủ đề</div>
  <div class='card' style='overflow-x:auto'>
    <table class='tbl'><thead><tr><th>Chủ đề</th><th>Đã làm</th><th>Đúng</th><th>Tỷ lệ</th><th></th></tr></thead><tbody>${catRows}</tbody></table>
  </div>

  <div class='sec-title'>Kết quả bài kiểm tra</div>
  <div class='card' style='overflow-x:auto'>
    <table class='tbl'><thead><tr><th>Bài kiểm tra</th><th>Số lần</th><th>Cao nhất</th><th>Gần nhất</th><th>Ngày</th></tr></thead><tbody>${testRows}</tbody></table>
  </div>

  <div class='sec-title'>Lịch sử hoạt động</div>
  <div class='card'>
    ${STORE.activity.length
      ? `<div style='overflow-x:auto'><table class='tbl'><thead><tr><th>Thời gian</th><th>Hoạt động</th><th>Điểm</th><th>Tỷ lệ</th></tr></thead><tbody>${
        STORE.activity.slice(0,20).map(a=>`<tr><td class='tiny muted'>${fmtDate(a.ts)}</td><td>${esc(a.label)}</td><td>${a.score}/${a.total}</td><td>${pct(a.score,a.total)}%</td></tr>`).join("")

  `;
}

      Bao gồm 10 bài học chi tiết và hơn 180 câu hỏi thuộc 9 dạng bài tập khác nhau.
    </p>
    <p class='small muted' style='margin-top:6px'>Toàn bộ nội dung được biên soạn riêng, không trích dẫn nguyên văn từ giáo trình nào.</p>
  </div>
  `;
}

/* =======================================================================
   18. SESSION MANAGEMENT
   ======================================================================= */
function startSession(config){
  let qs = config.questions.slice();
  qs = shuffle(qs).map(q=>Object.assign({}, q));
  state.session = {
    mode: config.mode,
    title: config.title,
    questions: qs,
    index: 0,
    results: [],
    currentAnswer: null,
    checked: false,
    startTs: Date.now(),
    limit: config.limit || null,
    remaining: config.limit || 0,
    timerId: null,
    testId: config.testId || null
  };
  state.matchState = {};
  if(config.limit){
    state.session.timerId = setInterval(tickTimer, 1000);
  }
  setView(state.view);
}
function tickTimer(){
  const s = state.session;
  if(!s) return;
  s.remaining--;
  if(s.remaining <= 0){
    s.remaining = 0;
    clearInterval(s.timerId);
    s.timerId = null;
    finishSession(true);
    return;
  }
  const el = document.getElementById("timerDisplay");
  if(el){
    el.textContent = "⏱ " + fmtTime(s.remaining);
    el.classList.toggle("danger", s.remaining <= 60);
  }
}
function stopTimer(){
  if(state.session && state.session.timerId){
    clearInterval(state.session.timerId);
    state.session.timerId = null;
  }
}
function renderSession(){
  const s = state.session;
  if(!s) return;
  const root = document.getElementById("view");
  const q = s.questions[s.index];
  const total = s.questions.length;
  const progressPct = Math.round((s.index / total) * 100);

  let timerHtml = "";
  if(s.limit) timerHtml = `<span class='timer ${s.remaining<=60?'danger':''}' id='timerDisplay'>⏱ ${fmtTime(s.remaining)}</span>`;

  let body = "";
  if(q.type === "mcq") body = renderOpts(q);
  else if(q.type === "fill") body = `<input type='text' class='answer' id='answerInput' placeholder='Nhập câu trả lời...' autocomplete='off' spellcheck='false'>`;
  else body = `<textarea class='answer' id='answerInput' placeholder='Viết câu trả lời của bạn...'></textarea>`;

  const prevDisabled = s.index === 0 ? "disabled" : "";
  const nextLabel = s.index === total-1 ? "Hoàn thành →" : "Câu tiếp →";

  root.innerHTML = `
  <div class='q-wrap'>
    <div class='q-top'>
      <button class='btn sm ghost' data-action='abandon-session'>← Thoát</button>
      <span class='q-counter'>Câu ${s.index+1} / ${total}</span>
      ${timerHtml}
      <span class='spacer'></span>
      <span class='badge info'>${esc(s.title)}</span>
    </div>
    <div class='bar' style='margin-bottom:16px'><span style='width:${progressPct}%'></span></div>
    <div class='card'>
      <div class='tiny muted' style='margin-bottom:6px'>${esc(TYPE_LABEL[q.type]||q.type)} · ${esc(CATEGORY_LABEL[q.category]||q.category)} · ${q.difficulty}</div>
      <div class='q-text'>${esc(q.question)}</div>
      ${body}
      <div id='feedbackSlot'></div>
      <div class='row' style='margin-top:16px'>
        <button class='btn ghost' data-action='prev-q' ${prevDisabled}>← Câu trước</button>
        <button class='btn' id='checkBtn' data-action='check-answer'>Kiểm tra</button>
        <button class='btn' id='nextBtn' data-action='next-q' style='display:none'>${nextLabel}</button>
        <span class='spacer'></span>
        <button class='btn sm soft' id='skipBtn' data-action='skip-q'>Bỏ qua</button>
      </div>
    </div>
  </div>`;

  // restore answer if user navigated back
  if(s.checked && s.results[s.index]){
    const r = s.results[s.index];
    lockUI();
    if(q.type === "mcq"){
      document.querySelectorAll(".opt").forEach(b=>{
        if(b.dataset.value === r.userAnswer) b.classList.add("sel");
        if(b.dataset.value === q.answer) b.classList.add("correct");
        if(b.dataset.value === r.userAnswer && !r.correct) b.classList.add("wrong");
      });
    }else{
      const inp = document.getElementById("answerInput");
      if(inp) inp.value = r.userAnswer || "";
    }
    if(r.auto){
      showFeedback(q, r.userAnswer, r.correct);
    }else{
      showSelfReview(q, r.userAnswer);
    }
    afterCheckUI();
  }
}
function renderOpts(q){
  return q.options.map((o,i)=>{
    const k = String.fromCharCode(65+i);
    return `<button class='opt' data-action='select-opt' data-value='${esc(o)}'><span class='k'>${k}</span><span>${esc(o)}</span></button>`;
  }).join("");
}
function lockUI(){
  document.querySelectorAll(".opt").forEach(b=>b.disabled = true);
  const inp = document.getElementById("answerInput");
  if(inp) inp.disabled = true;
}
function afterCheckUI(){
  const cb = document.getElementById("checkBtn");
  const nb = document.getElementById("nextBtn");
  const sb = document.getElementById("skipBtn");
  if(cb) cb.style.display = "none";
  if(sb) sb.style.display = "none";
  if(nb) nb.style.display = "inline-flex";
}

function gradeAuto(q, ans){
  if(q.type === "mcq"){
    return {auto:true, correct:norm(ans) === norm(q.answer)};
  }
  if(q.type === "fill"){
    const list = Array.isArray(q.answer) ? q.answer : [q.answer];
    const a = norm(ans);
    return {auto:true, correct: a.length>0 && list.some(x=>norm(x)===a)};
  }
  // self-review: reduced, clause, error, translate
  const list = Array.isArray(q.answer) ? q.answer : [q.answer];
  const a = norm(ans);
  if(a && list.some(x=>norm(x)===a)) return {auto:true, correct:true};
  return {auto:false, correct:null};
}

function currentAnswer(){
  const s = state.session;
  if(!s) return "";
  const q = s.questions[s.index];
  if(q.type === "mcq") return s.currentAnswer || "";
  const el = document.getElementById("answerInput");
  return el ? el.value.trim() : "";
}

function checkAnswer(){
  const s = state.session;
  if(!s || s.checked) return;
  const q = s.questions[s.index];
  const ans = currentAnswer();
  if(q.type === "mcq" && !ans){ flash("neutral","Chưa chọn đáp án","Hãy chọn một đáp án trước."); return; }
  if((q.type === "fill" || q.type === "reduced" || q.type === "clause" || q.type === "error" || q.type === "translate") && !ans){
    flash("neutral","Chưa nhập câu trả lời","Hãy nhập câu trả lời của bạn trước."); return;
  }

  const res = gradeAuto(q, ans);
  s.checked = true;
  const result = {qid:q.id, userAnswer:ans, correct:res.correct, auto:res.auto};
  // remove any existing record at this index (in case of revisiting)
  s.results = s.results.filter((_,i)=>i !== s.index);
  s.results[s.index] = result;

  if(res.auto){
    recordAnswer(q, res.correct, ans);
    showFeedback(q, ans, res.correct);
  }else{
    showSelfReview(q, ans);
  }
  lockUI();
  afterCheckUI();
}

function showFeedback(q, ans, correct){
  const slot = document.getElementById("feedbackSlot");
  if(!slot) return;
  if(q.type === "mcq"){
    document.querySelectorAll(".opt").forEach(b=>{
      if(b.dataset.value === q.answer) b.classList.add("correct");
      if(b.dataset.value === ans && !correct) b.classList.add("wrong");
    });
  }
  const cls = correct ? "ok" : "bad";
  const title = correct ? "✅ Chính xác!" : "❌ Chưa đúng";
  const correctAns = Array.isArray(q.answer) ? q.answer[0] : q.answer;
  slot.innerHTML = `
    <div class='feedback ${cls}'>
      <div class='fb-title'>${title}</div>
      ${!correct ? `<div class='fb-ans'><b>Câu trả lời của bạn:</b> ${esc(ans)}</div>` : ""}
      <div class='fb-ans'><b>Đáp án đúng:</b> ${esc(correctAns)}</div>
      ${STORE.settings.showExplanations ? `
        <div class='fb-exp'><b>Giải thích (EN):</b> ${esc(q.explanationEN)}</div>
        <div class='fb-exp'><b>Giải thích (VI):</b> ${esc(q.explanationVI)}</div>
      ` : ""}
    </div>`;
}
function showSelfReview(q, ans){
  const slot = document.getElementById("feedbackSlot");
  if(!slot) return;
  const model = Array.isArray(q.answer) ? q.answer[0] : q.answer;
  slot.innerHTML = `
    <div class='feedback neutral'>
      <div class='fb-title'>🔎 Tự đánh giá</div>
      <div>Hệ thống không thể chấm chính xác tuyệt đối dạng câu này. Hãy so sánh câu của bạn với đáp án mẫu.</div>
      <div class='fb-ans'><b>Câu trả lời của bạn:</b> ${esc(ans)}</div>
      <div class='fb-ans'><b>Đáp án mẫu:</b> ${esc(model)}</div>
      ${q.answer && q.answer.length > 1 ? `<div class='fb-ans'><b>Các đáp án khác được chấp nhận:</b> ${q.answer.slice(1).map(esc).join(" · ")}</div>` : ""}
      ${STORE.settings.showExplanations ? `
        <div class='fb-exp'><b>Giải thích (EN):</b> ${esc(q.explanationEN)}</div>
        <div class='fb-exp'><b>Giải thích (VI):</b> ${esc(q.explanationVI)}</div>
      ` : ""}
      <div class='row' style='margin-top:12px'>
        <button class='btn sm' data-action='self-mark' data-ok='1'>✔ Câu trả lời của tôi đúng</button>
        <button class='btn sm danger' data-action='self-mark' data-ok='0'>✘ Tôi đã sai</button>
      </div>
    </div>`;
}
function flash(kind, title, msg){
  const slot = document.getElementById("feedbackSlot");
  if(!slot) return;
  slot.innerHTML = `<div class='feedback ${kind}'><div class='fb-title'>${esc(title)}</div>${esc(msg)}</div>`;
}
function goNext(){
  const s = state.session;
  if(!s) return;
  if(s.index >= s.questions.length - 1){
    finishSession(false);
    return;
  }
  s.index++;
  s.checked = false;
  s.currentAnswer = null;
  renderSession();
}
function goPrev(){
  const s = state.session;
  if(!s || s.index === 0) return;
  s.index--;
  s.checked = !!s.results[s.index];
  s.currentAnswer = null;
  renderSession();
}
function skipQuestion(){
  const s = state.session;
  if(!s) return;
  const q = s.questions[s.index];
  s.results = s.results.filter((_,i)=>i !== s.index);
  s.results[s.index] = {qid:q.id, userAnswer:"", correct:false, auto:true, skipped:true};
  recordAnswer(q, false, "(bỏ qua)");
  goNext();
}
function finishSession(timeUp){
  const s = state.session;
  if(!s) return;
  stopTimer();
  const total = s.questions.length;
  let correct = 0;
  s.results.forEach(r=>{ if(r && r.correct === true) correct++; });
  const percent = pct(correct, total);
  const seconds = Math.round((Date.now() - s.startTs)/1000);

  if(s.mode === "test" && s.testId){
    const t = TESTS.find(x=>x.id===s.testId);
    if(t){
      const prev = STORE.tests[t.id] || {attempts:0, best:0, last:0, lastDate:null};
      prev.attempts++;
      if(percent > (prev.best||0)) prev.best = percent;
      prev.last = percent;
      prev.lastDate = Date.now();
      STORE.tests[t.id] = prev;
      recordActivity("test", `${t.title} · ${correct}/${total}`, correct, total);
    }
  }else if(s.mode === "practice"){
    recordActivity("practice", `Practice · ${correct}/${total}`, correct, total);
  }else if(s.mode === "review"){
    recordActivity("review", `Ôn lỗi sai · ${correct}/${total}`, correct, total);
  }

  const rows = s.results.map((r,i)=>{
    if(!r) return "";
    const q = s.questions[i];
    const ok = r.correct === true;
    const correctAns = Array.isArray(q.answer) ? q.answer[0] : q.answer;
    return `<tr>
      <td>${i+1}</td>
      <td>${esc(q.question.length>70?q.question.slice(0,70)+'…':q.question)}</td>
      <td>${esc((r.userAnswer||"(bỏ qua)").slice(0,60))}</td>
      <td>${esc(correctAns.length>60?correctAns.slice(0,60)+'…':correctAns)}</td>
      <td>${ok?"<span class='badge ok'>Đúng</span>":r.auto===false?"<span class='badge warn'>Tự đánh giá</span>":"<span class='badge bad'>Sai</span>"}</td>
    </tr>`;
  }).join("");

  const suggestion = percent >= 80
    ? "Kết quả xuất sắc! Hãy tiếp tục với các bài tập nâng cao hoặc bài kiểm tra tiếp theo."
    : (percent >= 50
      ? "Kết quả khá ổn. Xem lại các câu sai và ôn lại phần lý thuyết liên quan."
      : "Hãy quay lại bài học lý thuyết, đọc kỹ các cấu trúc, sau đó làm lại bài tập.");

  const sessionRef = s;
  state.session = null;
  state.matchState = {};

  const root = document.getElementById("view");
  root.innerHTML = `
  <div class='q-wrap'>
    <div class='card result-hero'>
      <div class='score-ring' style='--pct:${percent}%'><span>${percent}%</span><small>CHÍNH XÁC</small></div>
      <h2 style='font-size:20px'>${timeUp?"⏰ Hết giờ!":"🎉 Hoàn thành!"}</h2>
      <p class='muted small'>${esc(sessionRef.title)}</p>
      <div class='grid g4' style='margin-top:18px'>
        ${statCard("Tổng số câu", String(total))}
        ${statCard("Trả lời đúng", String(correct))}
        ${statCard("Trả lời sai", String(total-correct))}
        ${statCard("Thời gian", fmtTime(seconds))}
      </div>
      <div class='feedback neutral' style='margin-top:16px;text-align:left'>
        <div class='fb-title'>💡 Gợi ý</div>${esc(suggestion)}
      </div>
      <div class='row' style='margin-top:16px;justify-content:center'>
        <button class='btn' data-action='nav' data-view='practice'>✏️ Luyện tập tiếp</button>
        <button class='btn ghost' data-action='nav' data-view='mistakes'>🔁 Ôn lỗi sai</button>
        <button class='btn soft' data-action='nav' data-view='progress'>📈 Xem tiến độ</button>
      </div>
    </div>
    <div class='card' style='margin-top:16px'>
      <b>Xem lại chi tiết</b>
      <div style='overflow-x:auto;margin-top:10px'>
        <table class='tbl'>
          <thead><tr><th>#</th><th>Câu hỏi</th><th>Bạn trả lời</th><th>Đáp án</th><th>Kết quả</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
  updateTopStats();
}

/* =======================================================================
   19. MATCHING SESSION
   ======================================================================= */
function startMatching(id){
  const m = MATCHING.find(x=>x.id===id);
  if(!m) return;
  state.session = {
    mode:"matching",
    title: m.title,
    matching: m,
    startTs: Date.now(),
    checked:false,
    results:[]
  };
  state.matchState = {};
  renderMatchingSession();
}
function renderMatchingSession(){
  const s = state.session;
  if(!s || s.mode !== "matching") return;
  const m = s.matching;
  const rights = shuffle(m.pairs.map(p=>p.right));
  const rows = m.pairs.map((p,i)=>{
    const sel = state.matchState[i] || "";
    const opts = ["<option value=''>— Chọn vế phù hợp —</option>"].concat(
      rights.map(r=>`<option value='${esc(r)}' ${sel===r?"selected":""}>${esc(r)}</option>`)
    ).join("");
    return `<div class='match-row' data-mi='${i}'>
      <div class='match-left'>${i+1}. ${esc(p.left)}</div>
      <select class='match' data-action='match-select' data-mi='${i}'>${opts}</select>
    </div>`;
  }).join("");

  document.getElementById("view").innerHTML = `
  <div class='q-wrap'>
    <div class='q-top'>
      <button class='btn sm ghost' data-action='abandon-session'>← Thoát</button>
      <span class='badge info'>${esc(m.title)}</span>
    </div>
    <div class='card'>
      <h3 style='font-size:16px;margin-bottom:12px'>Nối các cặp phù hợp</h3>
      <div id='matchRows'>${rows}</div>
      <div id='feedbackSlot'></div>
      <div class='row' style='margin-top:16px'>
        <button class='btn' id='checkBtn' data-action='check-matching'>Kiểm tra</button>
        <button class='btn ghost' data-action='nav' data-view='practice' style='display:none' id='doneBtn'>← Về Practice</button>
      </div>
    </div>
  </div>`;
}
function checkMatching(){
  const s = state.session;
  if(!s || s.mode !== "matching" || s.checked) return;
  const m = s.matching;
  let correct = 0;
  m.pairs.forEach((p,i)=>{
    const row = document.querySelector(`[data-mi='${i}']`);
    const sel = state.matchState[i];
    if(sel === p.right){ correct++; if(row) row.classList.add("correct"); }
    else{ if(row) row.classList.add("wrong"); }
  });
  s.checked = true;
  document.querySelectorAll("select.match").forEach(sel=>sel.disabled = true);
  document.getElementById("checkBtn").style.display = "none";
  document.getElementById("doneBtn").style.display = "inline-flex";

  const slot = document.getElementById("feedbackSlot");
  const pct = Math.round((correct/m.pairs.length)*100);
  slot.innerHTML = `<div class='feedback ${correct===m.pairs.length?'ok':'bad'}'>
    <div class='fb-title'>${correct===m.pairs.length?'✅ Hoàn hảo!':`Bạn nối đúng ${correct}/${m.pairs.length} cặp`}</div>
    <div class='fb-exp'><b>Giải thích:</b> ${esc(m.explanationVI)}</div>
  </div>`;

  // record answers
  m.pairs.forEach((p,i)=>{
    const ok = state.matchState[i] === p.right;
    STORE.stats.attempted++;
    if(ok) STORE.stats.correct++;
    if(!STORE.categories[m.category]) STORE.categories[m.category] = {attempted:0,correct:0};
    STORE.categories[m.category].attempted++;
    if(ok) STORE.categories[m.category].correct++;
  });
  recordActivity("matching", `${m.title} · ${correct}/${m.pairs.length}`, correct, m.pairs.length);
  touchStreak();
  saveStore();
  updateTopStats();
}

/* =======================================================================
   20. EVENT HANDLERS
   ======================================================================= */
document.addEventListener("click", function(ev){
  const btn = ev.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;
  switch(action){
    case "nav": setView(btn.dataset.view); closeSidebar(); break;
    case "toggle-sidebar": toggleSidebar(); break;
    case "close-sidebar": closeSidebar(); break;
    case "select-lesson": state.lessonId = Number(btn.dataset.id); render(); break;
    case "continue-lesson": state.lessonId = Number(btn.dataset.id); setView("lessons"); break;
    case "prev-lesson": if(state.lessonId>1){ state.lessonId--; render(); } break;
    case "next-lesson": if(state.lessonId<10){ state.lessonId++; render(); } break;
    case "mark-lesson-done": {
      const id = Number(btn.dataset.id);
      if(STORE.lessonsCompleted[id]) delete STORE.lessonsCompleted[id];
      else STORE.lessonsCompleted[id] = true;
      saveStore();
      render();
      break;
    }
    case "select-cat": state.practiceCategory = btn.dataset.cat; render(); break;
    case "select-diff": state.practiceDifficulty = btn.dataset.diff; render(); break;
    case "select-ptype": state.practiceType = btn.dataset.ptype; render(); break;
    case "start-practice": {
      const pool = QUESTIONS.filter(q=>{
        if(state.practiceCategory!=='all' && q.category !== state.practiceCategory) return false;
        if(state.practiceDifficulty!=='all' && q.difficulty !== state.practiceDifficulty) return false;
        if(state.practiceType!=='all' && q.type !== state.practiceType) return false;
        return true;
      });
      if(!pool.length){ alert("Không có câu hỏi nào phù hợp với bộ lọc hiện tại."); return; }
      startSession({
        mode:"practice",
        title:`Practice · ${state.practiceCategory==='all'?'Tất cả':CATEGORY_LABEL[state.practiceCategory]}`,
        questions: pool.slice(0, Math.min(20, pool.length))
      });
      break;
    }
    case "start-matching": startMatching(btn.dataset.id); break;
    case "start-test": {
      const t = TESTS.find(x=>x.id===btn.dataset.id);
      if(!t) return;
      const qs = t.questionIds.map(getQ).filter(Boolean);
      if(!qs.length) return;
      startSession({
        mode:"test",
        title: t.title,
        testId: t.id,
        questions: qs,
        limit: t.time
      });
      break;
    }
    case "select-opt": {
      const s = state.session;
      if(!s || s.checked) return;
      s.currentAnswer = btn.dataset.value;
      document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      break;
    }
    case "check-answer": checkAnswer(); break;
    case "next-q": goNext(); break;
    case "prev-q": goPrev(); break;
    case "skip-q": skipQuestion(); break;
    case "self-mark": {
      const ok = btn.dataset.ok === "1";
      const s = state.session;
      if(!s) return;
      const idx = s.index;
      const r = s.results[idx];
      if(!r) return;
      r.correct = ok;
      r.auto = true;
      const q = s.questions[idx];
      recordAnswer(q, ok, r.userAnswer);
      const slot = document.getElementById("feedbackSlot");
      if(slot){
        slot.innerHTML = `<div class='feedback ${ok?'ok':'bad'}'>
          <div class='fb-title'>${ok?'✅ Đã ghi nhận: đúng':'❌ Đã ghi nhận: sai'}</div>
          <div class='fb-exp'><b>Đáp án mẫu:</b> ${esc(Array.isArray(q.answer)?q.answer[0]:q.answer)}</div>
        </div>`;
      }
      updateTopStats();
      break;
    }
    case "abandon-session": {
      if(!state.session){ setView("practice"); break; }
      if(confirm("Thoát? Kết quả lượt làm bài này sẽ không được lưu.")){
        stopTimer();
        state.session = null;
        state.matchState = {};
        render();
      }
      break;
    }
    case "check-matching": checkMatching(); break;
    case "retry-one": {
      const q = getQ(btn.dataset.id);
      if(!q) return;
      startSession({ mode:"review", title:"Ôn lại câu sai", questions:[q] });
      break;
    }
    case "retry-all-mistakes": {
      const ids = Object.keys(STORE.mistakes);
      const qs = ids.map(getQ).filter(Boolean);
      if(!qs.length) return;
      startSession({ mode:"review", title:`Ôn lại ${qs.length} câu sai`, questions: qs });
      break;
    }
    case "remove-mistake": {
      delete STORE.mistakes[btn.dataset.id];
      saveStore();
      render();
      break;
    }
    case "clear-mistakes": {
      if(confirm("Xoá toàn bộ danh sách lỗi sai?")){
        STORE.mistakes = {};
        saveStore();
        render();
      }
      break;
    }
    case "save-settings": {
      const dark = document.getElementById("setDark").checked;
      const exp = document.getElementById("setExp").checked;
      STORE.settings.darkMode = dark;
      STORE.settings.showExplanations = exp;
      saveStore();
      applyTheme();
      alert("Đã lưu thiết lập.");
      break;
    }
    case "reset-lessons": {
      if(confirm("Đặt lại toàn bộ bài học đã hoàn thành?")){
        STORE.lessonsCompleted = {};
        saveStore(); render();
      }
      break;
    }
    case "reset-tests": {
      if(confirm("Đặt lại kết quả tất cả bài kiểm tra?")){
        STORE.tests = {};
        saveStore(); render();
      }
      break;
    }
    case "reset-mistakes": {
      if(confirm("Xoá toàn bộ danh sách lỗi sai?")){
        STORE.mistakes = {};
        saveStore(); render();
      }
      break;
    }
    case "reset-all": {
      if(confirm("Bạn có chắc chắn muốn đặt lại TOÀN BỘ tiến độ? Hành động này không thể hoàn tác.")){
        if(confirm("Xác nhận lần cuối — xoá toàn bộ dữ liệu học tập?")){
          STORE = defaultStore();
          saveStore();
          state.session = null;
          setView("dashboard");
        }
      }
      break;
    }
    /* Mini practice inside lessons */
    case "mini-opt": {
      const qid = btn.dataset.qid;
      const group = btn.dataset.group;
      const q = getQ(qid);
      if(!q) return;
      const container = document.querySelector(`[data-mini='${qid}']`);
      if(!container || container.dataset.done === "1") return;
      container.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      container.dataset.selected = btn.dataset.value;
      break;
    }
    case "mini-check": {
      const qid = btn.dataset.qid;
      const q = getQ(qid);
      if(!q) return;
      const container = document.querySelector(`[data-mini='${qid}']`);
      if(!container || container.dataset.done === "1") return;
      const selected = container.dataset.selected;
      if(!selected){ alert("Hãy chọn một đáp án trước."); return; }
      const correct = norm(selected) === norm(q.answer);
      container.dataset.done = "1";
      container.querySelectorAll(".opt").forEach(b=>{
        b.disabled = true;
        if(b.dataset.value === q.answer) b.classList.add("correct");
        if(b.dataset.value === selected && !correct) b.classList.add("wrong");
      });
      const slot = container.querySelector(".feedback-slot");
      slot.innerHTML = `<div class='feedback ${correct?'ok':'bad'}'>
        <div class='fb-title'>${correct?'✅ Chính xác!':'❌ Chưa đúng'}</div>
        <div class='fb-ans'><b>Đáp án:</b> ${esc(q.answer)}</div>
        <div class='fb-exp'><b>Giải thích:</b> ${esc(q.explanationVI)}</div>
      </div>`;
      recordAnswer(q, correct, selected);
      updateTopStats();
      break;
    }
    default: break;
  }
});

document.addEventListener("change", function(ev){
  const t = ev.target;
  if(t.matches("[data-action='match-select']")){
    const i = Number(t.dataset.mi);
    if(t.value) state.matchState[i] = t.value;
    else delete state.matchState[i];
    renderMatchingSession();
  }
});

document.addEventListener("input", function(ev){
  if(ev.target.id === "lessonSearch"){
    state.searchTerm = ev.target.value;
    // debounce-ish: rerender after user stops briefly via timeout
    clearTimeout(window.__lessonSearchT);
    window.__lessonSearchT = setTimeout(()=>{
      const focusVal = state.searchTerm;
      const el = document.getElementById("view");
      el.innerHTML = viewLessons();
      const inp = document.getElementById("lessonSearch");
      if(inp){ inp.value = focusVal; inp.focus(); }
    }, 200);
  }
  if(ev.target.id === "mistakeSearch"){
    state.mistakeSearch = ev.target.value;
    clearTimeout(window.__mistakeSearchT);
    window.__mistakeSearchT = setTimeout(()=>{
      const v = state.mistakeSearch;
      document.getElementById("view").innerHTML = viewMistakes();
      const inp = document.getElementById("mistakeSearch");
      if(inp){ inp.value = v; inp.focus(); }
    }, 200);
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter") return;
  const s = state.session;
  if(!s) return;
  const active = document.activeElement;
  if(active && active.id === "answerInput"){
    ev.preventDefault();
    if(!s.checked) checkAnswer();
    else goNext();
  }
});

/* =======================================================================
   21. INIT
   ======================================================================= */
loadStore();
applyTheme();
setView("dashboard");
</script>
</body>
</html>
